{{ $colors := slice "blue" "red" "yellow" "green" }}
{{ with site.Data.feature }}
<section class="section" id="feature">
  <div class="wrap">
    {{ partial "sectionHead.html" (dict "title" .title) }}
    <div class="grid rules cards-3">
      {{ range $i, $f := .features }}
      <div class="card">
        <span class="bar" style="--accent: var(--df-{{ index $colors (mod $i 4) }})"></span>
        <h3>{{ $f.name }}</h3>
        <p>{{ $f.description }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
